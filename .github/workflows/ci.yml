name: ci

on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "*.js"
      - "*.json"
      - "popup.html"
      - "tools/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "*.js"
      - "*.json"
      - "popup.html"
      - "tools/**"

jobs:
  static-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate extension files
        run: node tools/validate-extension.js
