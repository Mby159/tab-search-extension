name: ci

on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "*.js"
      - "*.json"
      - "popup.html"
      - "tools/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "*.js"
      - "*.json"
      - "popup.html"
      - "tools/**"

jobs:
  static-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate extension files
        run: node tools/validate-extension.js

  browser-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: browser-actions/setup-chrome@v1

      - name: Firefox web-ext lint
        run: npx --yes web-ext lint --source-dir .

      - name: Firefox web-ext build
        run: npx --yes web-ext build --source-dir . --artifacts-dir web-ext-artifacts --overwrite-dest

      - name: Chromium extension load smoke
        env:
          CHROMIUM: chrome
        run: node tools/chromium-smoke.js

      - name: Install Playwright driver
        run: npm install --no-save playwright-core

      - name: Chromium popup interaction smoke
        env:
          CHROMIUM: chrome
          ARTIFACT_DIR: playwright-artifacts
        run: xvfb-run -a node tools/interaction-smoke.js

      - name: Upload interaction screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tab-search-extension-interaction-screenshots
          path: playwright-artifacts
          if-no-files-found: ignore
